<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>거래처 관리 · 지도</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1>🚚 거래처 관리 <span id="roleBadge" class="role-badge"></span></h1>
  <div class="topbar-actions">
    <button id="addBtn" class="btn primary hidden">+ 신규 거래처</button>
    <button id="logoutBtn" class="btn">로그아웃</button>
  </div>
</header>

<div id="dbUsageBar" class="db-usage-bar hidden">
  <span id="dbUsageText" class="db-usage-text"></span>
  <div class="db-usage-track">
    <div id="dbUsageFill" class="db-usage-fill"></div>
  </div>
</div>

<main class="layout" id="layout">
  <section id="map" class="map"></section>

  <section class="list-panel">
    <div class="tab-switcher">
      <button id="tabClients" class="tab-btn">전체 거래처</button>
      <button id="tabSchedule" class="tab-btn">오늘의 배차</button>
      <button id="tabCalendar" class="tab-btn">달력</button>
      <button id="tabInventory" class="tab-btn">재고</button>
      <button id="tabPallet" class="tab-btn">파렛트</button>
      <button id="tabBulletin" class="tab-btn">메모</button>
    </div>

    <div id="clientsView">
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="회사명, 주소, 담당자 검색" />
      </div>
      <ul id="clientList" class="client-list"></ul>
    </div>

    <div id="scheduleView" class="hidden">
      <div id="vehicleSwitcher" class="vehicle-switcher">
        <button type="button" class="vehicle-btn" data-vehicle="3.5t">3.5t</button>
        <button type="button" class="vehicle-btn" data-vehicle="5t">5t</button>
      </div>

      <div class="schedule-date-box">
        <button id="schedulePrevDay" class="btn" type="button">‹</button>
        <input type="date" id="scheduleDate" />
        <button id="scheduleNextDay" class="btn" type="button">›</button>
      </div>

      <div id="scheduleAddBox" class="schedule-add-box hidden">
        <select id="scheduleAddSelect">
          <option value="">거래처 선택해서 추가...</option>
        </select>
        <button id="scheduleAddBtn" class="btn" type="button">+ 추가</button>
      </div>

      <div id="scheduleStartBox" class="schedule-start-box hidden">
        <button id="scheduleStartBtn" class="btn primary" type="button">🚚 오늘 배차 시작</button>
      </div>
      <div id="scheduleStartedInfo" class="schedule-started-info hidden"></div>

      <div id="scheduleProgressBox" class="schedule-progress-box hidden">
        <div id="scheduleProgressNext" class="schedule-progress-next"></div>
        <div id="scheduleProgressCount" class="schedule-progress-count"></div>
      </div>

      <ol id="scheduleList" class="schedule-list"></ol>
    </div>

    <div id="calendarView" class="hidden">
      <div class="cal-month-nav">
        <button id="calPrevMonth" class="btn" type="button">‹</button>
        <div id="calMonthLabel" class="cal-month-label"></div>
        <button id="calNextMonth" class="btn" type="button">›</button>
      </div>

      <div id="calGrid" class="cal-grid"></div>
    </div>

    <div id="inventoryView" class="hidden">
      <div id="inventoryAddBox" class="inventory-add-box hidden">
        <button id="inventoryAddBtn" class="btn primary" type="button">+ 품목 추가</button>
      </div>
      <ul id="inventoryList" class="inventory-list"></ul>
    </div>

    <div id="palletView" class="hidden">
      <div id="palletAddBox" class="pallet-add-box hidden">
        <button id="palletAddBtn" class="btn primary" type="button">+ 거래처 추가</button>
      </div>
      <ul id="palletList" class="pallet-list"></ul>
    </div>

    <div id="bulletinView" class="hidden">
      <div id="bulletinAddBox" class="bulletin-add-box hidden">
        <textarea id="bulletinInput" rows="2" placeholder="공지사항이나 메모를 입력하세요"></textarea>
        <button id="bulletinSubmitBtn" class="btn primary" type="button">등록</button>
      </div>
      <ul id="bulletinList" class="bulletin-list"></ul>
    </div>
  </section>
</main>

<!-- 신규/수정 거래처 모달 -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">신규 거래처 추가</h2>
    <form id="clientForm">
      <input type="hidden" id="clientId" />
      <label>회사명 *
        <input id="fName" type="text" required placeholder="예: 삼성물류창고" />
      </label>
      <label>주소 *
        <input id="fAddress" type="text" required placeholder="예: 서울특별시 강남구 테헤란로 152" />
      </label>
      <label>담당자
        <input id="fManager" type="text" placeholder="예: 김철수" />
      </label>
      <label>연락처
        <input id="fPhone" type="tel" placeholder="예: 010-1234-5678" />
      </label>
      <label>메모
        <textarea id="fMemo" rows="2" placeholder="상하차 시간, 주의사항 등"></textarea>
      </label>

      <div id="formError" class="form-error hidden"></div>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn">취소</button>
        <button type="submit" id="deleteBtn" class="btn danger hidden">삭제</button>
        <button type="submit" id="saveBtn" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 신규/수정 재고 품목 모달 -->
<div id="inventoryModalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="inventoryModalTitle">신규 품목 추가</h2>
    <form id="inventoryForm">
      <input type="hidden" id="invId" />
      <label>품목명 *
        <input id="invName" type="text" required placeholder="예: 파렛트" />
      </label>
      <label>수량 *
        <input id="invQuantity" type="number" required min="0" step="1" placeholder="예: 20" />
      </label>
      <label>연결 거래처 (선택)
        <select id="invClientId">
          <option value="">연결 안 함</option>
        </select>
      </label>
      <label>단위
        <input id="invUnit" type="text" placeholder="예: 개, 박스, kg" />
      </label>
      <label>메모
        <textarea id="invMemo" rows="2" placeholder="보관 위치, 주의사항 등"></textarea>
      </label>

      <div id="inventoryFormError" class="form-error hidden"></div>

      <div class="modal-actions">
        <button type="button" id="inventoryCancelBtn" class="btn">취소</button>
        <button type="submit" id="inventoryDeleteBtn" class="btn danger hidden">삭제</button>
        <button type="submit" id="inventorySaveBtn" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 파렛트 관리 대상 거래처 추가/설정 모달 -->
<div id="palletClientModalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="palletClientModalTitle">파렛트 관리 거래처 추가</h2>
    <form id="palletClientForm">
      <label>거래처 *
        <select id="palletClientSelect">
          <option value="">거래처 선택...</option>
        </select>
      </label>
      <label>파렛트 종류 1
        <input id="palletType1Name" type="text" placeholder="예: KPP" />
      </label>
      <label>파렛트 종류 2 (선택)
        <input id="palletType2Name" type="text" placeholder="예: 자체파렛트" />
      </label>
      <label>파렛트 종류 3 (선택)
        <input id="palletType3Name" type="text" placeholder="비워두면 사용 안 함" />
      </label>

      <div id="palletClientFormError" class="form-error hidden"></div>

      <div class="modal-actions">
        <button type="button" id="palletClientCancelBtn" class="btn">취소</button>
        <button type="submit" id="palletClientDeleteBtn" class="btn danger hidden">관리 대상에서 제외</button>
        <button type="submit" id="palletClientSaveBtn" class="btn primary">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 파렛트 입출고 기록 추가 모달 -->
<div id="palletEntryModalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="palletEntryModalTitle">파렛트 입출고 기록</h2>
    <form id="palletEntryForm">
      <div class="pallet-entry-direction">
        <label><input type="radio" name="palletDirection" value="out" checked /> 출고 (거래처에 줌)</label>
        <label><input type="radio" name="palletDirection" value="in" /> 입고 (거래처에서 회수)</label>
      </div>
      <label>수량 *
        <input id="palletEntryQuantity" type="number" required min="1" step="1" placeholder="예: 10" />
      </label>
      <label>날짜 *
        <input id="palletEntryDate" type="date" required />
      </label>
      <label>메모
        <input id="palletEntryMemo" type="text" placeholder="예: 배송 건 관련" />
      </label>

      <div id="palletEntryFormError" class="form-error hidden"></div>

      <div class="modal-actions">
        <button type="button" id="palletEntryCancelBtn" class="btn">취소</button>
        <button type="submit" class="btn primary">기록 추가</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
